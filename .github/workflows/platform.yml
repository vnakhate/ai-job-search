name: JobPilot platform
on:
  pull_request:
    paths:
      [
        "platform/**",
        ".claude/skills/job-application-assistant/**",
        ".github/workflows/platform.yml",
      ]
  push:
    paths:
      [
        "platform/**",
        ".claude/skills/job-application-assistant/**",
        ".github/workflows/platform.yml",
      ]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx wrangler deploy --dry-run --env="" --outdir /tmp/jobpilot-worker-build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:uat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobpilot-uat-results
          path: |
            platform/playwright-report/
            platform/test-results/
          retention-days: 14
